<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market Analysis · Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem("market-analysis-theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="login-page">
  <form class="login-card" method="post">
    <div class="login-icon">📈</div>
    <h1 class="login-title">Market Analysis</h1>
    <p class="login-subtitle">Introduce tu contraseña para continuar</p>
    <div class="login-field">
      <input type="password" name="password" placeholder="Contraseña" autofocus autocomplete="current-password" />
    </div>
    {% if error %}<p class="login-error">⚠️ {{ error }}</p>{% endif %}
    <button type="submit" class="login-submit">Entrar →</button>
    <a href="{{ url_for('index') }}" class="login-guest-link">Continuar como invitado</a>
  </form>
</div>
</body>
</html>
